<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Responsive Internship Board for finding internships by title, company, and domain.">

    <title>Responsive Internship Board</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container">
            <h1>Internship Board</h1>

            <p>
                Find internships that match your skills and career goals.
            </p>
        </div>
    </header>

    <!-- Main content -->
    <main>

        <!-- Search and filter section -->
        <section class="search-section" aria-labelledby="search-heading">

            <div class="container">

                <h2 id="search-heading">Find an Internship</h2>

                <form id="searchForm">

                    <!-- Search input -->
                    <div class="form-group">

                        <label for="searchInput">
                            Search internships
                        </label>

                        <input
                            type="search"
                            id="searchInput"
                            name="search"
                            placeholder="Search by title, company, or skill"
                            autocomplete="off"
                        >

                    </div>

                    <!-- Domain filter -->
                    <div class="form-group">

                        <label for="domainFilter">
                            Filter by domain
                        </label>

                        <select id="domainFilter" name="domain">

                            <option value="all">
                                All Domains
                            </option>

                            <option value="Java">
                                Java
                            </option>

                            <option value="Web Development">
                                Web Development
                            </option>

                            <option value="Python">
                                Python
                            </option>

                            <option value="React">
                                React
                            </option>

                            <option value="Data Science">
                                Data Science
                            </option>

                        </select>

                    </div>

                    <!-- Search button -->
                    <button type="submit">
                        Search
                    </button>

                </form>

            </div>

        </section>

        <!-- Internship listing section -->
        <section
            class="internship-section"
            aria-labelledby="internship-heading"
        >

            <div class="container">

                <div class="section-header">

                    <h2 id="internship-heading">
                        Available Internships
                    </h2>

                    <!-- Dynamic result count -->
                    <p id="resultCount" aria-live="polite">
                        0 internships found
                    </p>

                </div>

                <!-- Error message -->
                <div
                    id="errorMessage"
                    class="message error-message"
                    role="alert"
                    hidden
                >
                    Something went wrong. Please try again.
                </div>

                <!-- Empty state -->
                <div
                    id="emptyMessage"
                    class="message empty-message"
                    role="status"
                    hidden
                >
                    No internships found. Try another search or domain.
                </div>

                <!-- Internship cards will be added here using JavaScript -->
                <div
                    id="internshipList"
                    class="internship-grid"
                    aria-live="polite"
                >
                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 Internship Board. Built with HTML, CSS and JavaScript.
            </p>

        </div>

    </footer>

    <!-- JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
