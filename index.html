<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Responsive Internship Board - Search and filter internship opportunities">

    <title>Responsive Internship Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <div class="container">

            <h1>Internship Board</h1>

            <p>
                Find your next internship opportunity
            </p>

        </div>

    </header>


    <!-- Main Content -->
    <main class="container">

        <!-- Search and Filter -->
        <section class="filter-section"
                 aria-label="Search and filter internships">

            <!-- Search -->
            <div class="form-group">

                <label for="searchInput">
                    Search Internships
                </label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search by title, domain or skill"
                    autocomplete="off"
                    aria-describedby="searchHelp"
                >

                <small id="searchHelp">
                    Enter internship title, domain or skill.
                </small>

            </div>


            <!-- Domain Filter -->
            <div class="form-group">

                <label for="domainFilter">
                    Filter by Domain
                </label>

                <select id="domainFilter">

                    <option value="all">
                        All Domains
                    </option>

                </select>

            </div>

        </section>


        <!-- Loading Message -->
        <p id="loadingMessage"
           class="message"
           role="status">

            Loading internships...

        </p>


        <!-- Error Message -->
        <div id="errorMessage"
             class="message error"
             role="alert"
             hidden>

            Unable to load internship records.
            Please try again.

        </div>


        <!-- Empty Message -->
        <div id="emptyMessage"
             class="message"
             role="status"
             hidden>

            No internships found.
            Try another search or domain.

        </div>


        <!-- Internship Cards -->
        <section
            id="internshipList"
            class="internship-grid"
            aria-label="Available internship listings"
            aria-live="polite">
        </section>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="container">

            <p>
                Responsive Internship Board &copy; 2026
            </p>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
